      <stop offset="0" stop-color="#FFC14D"/>
      <stop offset="0.45" stop-color="#FF7A3D"/>
      <stop offset="1" stop-color="#EE2F72"/>
    </linearGradient>
    <mask id="bite" maskUnits="userSpaceOnUse" x="-14" y="-14" width="574" height="178">
      <rect x="-14" y="-14" width="574" height="178" fill="#fff"/>
      <circle cx="284" cy="44" r="17" fill="#000"/>
      <circle cx="265" cy="33" r="11" fill="#000"/>
      <circle cx="296" cy="64" r="11" fill="#000"/>
    </mask>
  </defs>
  <g fill="none" stroke="#F5F1EC" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">
    <path d="M80.3 57.5 A35 35 0 1 0 80.3 92.5"/>
